version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: myscience-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myscience
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myscience-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/myscience
      PORT: 5000
      NODE_ENV: production
      SESSION_SECRET: dev-secret-change-in-production
      SECURE_COOKIES: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations

volumes:
  postgres_data: